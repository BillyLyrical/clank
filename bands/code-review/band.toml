name = "code-review"
description = "Review code: extract context → analyze quality → update world model"
trigger = "band.code-review"
output = "band.code-review.done"

[[steps]]
name = "extract_context"
code = """
    # Extract file types and change summary from state.
    my ($state) = @_;
    my $files = $state->{files} // [];
    my $summary = scalar(@$files) . " files changed";
    return { context => $summary, file_count => scalar(@$files) };
"""

[[steps]]
name = "analyze_quality"
handler = "critic.style"
